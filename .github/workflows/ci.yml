name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install browsers on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo does not commit a lockfile, so `npm install` rather than `npm ci`.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # The tests run headless, so only Chromium's headless shell is needed.
      # The browser is cached between runs; system libraries install each time.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell

      - name: Install Chromium for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Mobile end-to-end tests
        run: npm run test:mobile

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
